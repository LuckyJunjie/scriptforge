version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptforge-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./backend/data:/app/data
      - ./backend/scriptforge.db:/app/scriptforge.db
    restart: unless-stopped
    networks:
      - scriptforge-network

  # Frontend (Static)
  frontend:
    image: nginx:alpine
    container_name: scriptforge-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - scriptforge-network

  # Admin Dashboard (if separated)
  admin:
    image: nginx:alpine
    container_name: scriptforge-admin
    ports:
      - "8080:80"
    volumes:
      - ./admin:/usr/share/nginx/html:ro
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - scriptforge-network

networks:
  scriptforge-network:
    driver: bridge
